{% extends "pages/base.html" %}
{% block title %}New petition{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Start a petition</h1>
<form method="post" style="max-width:40rem">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label" for="title">Title</label>
        <input class="form-control" id="title" type="text" name="title" required />
    </div>
    <div class="mb-3">
        <label class="form-label" for="body">What are you asking for?</label>
        <textarea class="form-control" id="body" name="body" rows="6" required></textarea>
    </div>
    <button class="btn btn-primary" type="submit">Create</button>
</form>
{% endblock %}
